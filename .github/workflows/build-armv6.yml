name: Build librespot ARMv6 (Pi Zero)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-gnueabihf

      - name: Enable ARM architecture & install dependencies
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            pkg-config \
            libasound2-dev:armhf \
            libssl-dev:armhf \
            libc6-dev:armhf

      - name: Build for ARMv6
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig
          CC_arm_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
        run: cargo build --release --target arm-unknown-linux-gnueabihf --no-default-features --features alsa-backend

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: librespot-armv6
          path: target/arm-unknown-linux-gnueabihf/release/librespot
