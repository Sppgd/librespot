name: Build ARMv6 (Pi Zero) librespot

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-gnueabihf

      - name: Install cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Build for ARMv6
        run: cargo build --release --target arm-unknown-linux-gnueabihf

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: librespot-armv6
          path: target/arm-unknown-linux-gnueabihf/release/librespot
