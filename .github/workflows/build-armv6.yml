name: Build librespot ARMv6 (Pi Zero)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: arm-unknown-linux-gnueabihf

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf pkg-config

      - name: Build for ARMv6 (no system deps)
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          CC_arm_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
        run: cargo build --release \
              --target arm-unknown-linux-gnueabihf \
              --no-default-features \
              --features "alsa-backend,vendored-openssl"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: librespot-armv6
          path: target/arm-unknown-linux-gnueabihf/release/librespot
